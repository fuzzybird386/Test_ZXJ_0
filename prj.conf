# ─── Logging / Console ───────────────────────────────────────────────────────
CONFIG_LOG=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=y
CONFIG_SERIAL=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_SHELL_BACKEND_RTT=n
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=128

# printf float support
CONFIG_CBPRINTF_NANO=n
CONFIG_CBPRINTF_FP_SUPPORT=y

# ─── Peripheral drivers (reserved for ECW hardware interface) ─────────────────
CONFIG_SPI=y
CONFIG_DAC=n

# ─── Bluetooth Core ──────────────────────────────────────────────────────────
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ECW R1"

# ─── GATT ────────────────────────────────────────────────────────────────────
CONFIG_BT_GATT_CLIENT=y

# ─── PHY / DLE ───────────────────────────────────────────────────────────────
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_USER_PHY_UPDATE=y
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ─── MTU ─────────────────────────────────────────────────────────────────────
CONFIG_BT_L2CAP_TX_MTU=500
CONFIG_BT_BUF_ACL_TX_SIZE=500
CONFIG_BT_BUF_ACL_RX_SIZE=500
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=11
CONFIG_BT_ATT_TX_COUNT=10

# BLE 功率
CONFIG_BT_CTLR_TX_PWR_PLUS_7=y

# ─── BLE Services ────────────────────────────────────────────────────────────
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y


################################
# DIS 信息（不走 settings）
################################
CONFIG_BT_DIS_PNP=n
CONFIG_BT_DIS_MODEL_NUMBER_STR="MinNeuro R1"
CONFIG_BT_DIS_MANUF_NAME_STR="MinNeuro"

CONFIG_BT_DIS_SERIAL_NUMBER=y
CONFIG_BT_DIS_SERIAL_NUMBER_STR="F.A000001"

CONFIG_BT_DIS_FW_REV=y
CONFIG_BT_DIS_FW_REV_STR="1.2.0-single"
CONFIG_BT_DIS_HW_REV=y
CONFIG_BT_DIS_HW_REV_STR="MinNeuro Hardware"
CONFIG_BT_DIS_SW_REV=y
CONFIG_BT_DIS_SW_REV_STR="MinNeuro Software"


################################
# ❌ 明确关闭 settings（否则必炸）
################################
CONFIG_BT_SETTINGS=n
CONFIG_SETTINGS=n
CONFIG_BT_DIS_SETTINGS=n


################################
# CONFIG
################################

# looper_work_handler 运行于系统工作队列线程，适当加大其栈空间
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# main 线程栈
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_GPIO=y
CONFIG_PWM=n
CONFIG_SPI=y
CONFIG_PINCTRL=y
CONFIG_NRFX_SPIM=y
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_SPIS=n

# ECW additions
CONFIG_REBOOT=y
CONFIG_ADC=y

# CONFIG_NRFX_TIMER=y
# CONFIG_PINCTRL=y
# # CONFIG_I2C=y
# CONFIG_ADC=y
# CONFIG_NRFX_SAADC=y
# CONFIG_REBOOT=y

CONFIG_LOG_BACKEND_RTT=y
CONFIG_POWEROFF=y
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
